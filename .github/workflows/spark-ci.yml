name: Spark Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  spark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-spark.txt

      - name: Install Spark dependencies
        run: python -m pip install -r requirements-spark.txt

      - name: Generate synthetic banking data
        run: python src/generate_data.py

      - name: Run DuckDB pipeline
        run: python src/etl_pipeline.py

      - name: Run Spark pipeline
        run: python src/spark_pipeline.py

      - name: Reconcile Spark against DuckDB
        run: python src/compare_engines.py

      - name: Validate Spark output files
        run: python -m unittest discover -s tests -p "test_spark_output_contract.py" -v

      - name: Upload Spark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-pipeline-outputs
          path: data/spark_processed/
          if-no-files-found: warn
          retention-days: 7

