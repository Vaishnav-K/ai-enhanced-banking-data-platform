name: Banking Data Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python src/etl_pipeline.py

      - name: Run incremental pipeline
        run: python src/incremental_pipeline.py

      - name: Run quality report
        run: python src/quality_report.py

      - name: Run anomaly detection
        run: python src/anomaly_detection.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
