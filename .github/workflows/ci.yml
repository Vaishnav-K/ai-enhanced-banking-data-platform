name: Banking Data Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/spark-duckdb-consistency-10m]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate synthetic banking data
        run: python src/generate_data.py

      - name: Run observable pipeline and tests
        run: python src/demo.py

      - name: Upload pipeline run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-report
          path: data/processed/pipeline_run_report.json
          if-no-files-found: warn
          retention-days: 14
