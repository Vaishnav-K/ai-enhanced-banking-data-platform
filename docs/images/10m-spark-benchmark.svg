<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">10 million synthetic banking transactions processed with Apache Spark</title>
<desc id="desc">A measured local benchmark: 100,000 customers and 10 million transactions flow through Spark CSV ingestion, deduplication, validation, valid and quarantine outputs, and reconciliation. Result: PASS in 356.266 seconds at 28,068.91 raw transactions per second.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#121f38"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8a8ff"/><stop offset="1" stop-color="#62dcef"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7bd8ed"/></marker></defs>
<rect width="1200" height="700" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="698" rx="25" fill="none" stroke="#344461"/>
<text x="58" y="58" fill="#76dff0" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">MEASURED LOCAL SCALE EXPERIMENT</text><text x="58" y="108" fill="#f2f5ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">10,000,000 transactions. One reconciled run.</text><text x="58" y="143" fill="#a9b8d2" font-family="Arial,sans-serif" font-size="18">Synthetic banking data · Apache Spark 3.5.7 · Windows · local[2]</text>
<g font-family="Arial,sans-serif"><rect x="58" y="184" width="245" height="120" rx="15" fill="#172640" stroke="#5d7598"/><text x="80" y="217" fill="#a8bad8" font-size="14" letter-spacing="1.5">INPUT</text><text x="80" y="255" fill="#f5f7ff" font-size="29" font-weight="700">10M rows</text><text x="80" y="281" fill="#9db1ce" font-size="15">100K customers</text>
<path d="M310 244 H352" stroke="#7bd8ed" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="365" y="184" width="245" height="120" rx="15" fill="#182746" stroke="#7d75bb"/><text x="387" y="217" fill="#bcb0ff" font-size="14" letter-spacing="1.5">PROCESS</text><text x="387" y="255" fill="#f5f7ff" font-size="27" font-weight="700">Spark ETL</text><text x="387" y="281" fill="#aebbd3" font-size="15">Deduplicate + validate</text>
<path d="M617 244 H659" stroke="#7bd8ed" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="672" y="184" width="245" height="120" rx="15" fill="#172c36" stroke="#4d9b9b"/><text x="694" y="217" fill="#80e3d4" font-size="14" letter-spacing="1.5">OUTPUT</text><text x="694" y="255" fill="#f5f7ff" font-size="27" font-weight="700">10M valid</text><text x="694" y="281" fill="#a9c9d1" font-size="15">0 quarantined in this run</text>
<path d="M924 244 H966" stroke="#7bd8ed" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="979" y="184" width="163" height="120" rx="15" fill="#16372f" stroke="#65d6a5"/><text x="1000" y="217" fill="#81e5b7" font-size="14" letter-spacing="1.5">CHECK</text><text x="1000" y="257" fill="#f5fff9" font-size="31" font-weight="700">PASS</text><text x="1000" y="281" fill="#a9d9c1" font-size="14">Reconciled</text>
</g>
<text x="58" y="367" fill="#dfe7f8" font-family="Arial,sans-serif" font-size="17" font-weight="700">OBSERVED BENCHMARK METRICS</text>
<g font-family="Arial,sans-serif"><rect x="58" y="390" width="330" height="105" rx="14" fill="#101b30" stroke="#2e405e"/><text x="80" y="423" fill="#91a5c5" font-size="14">END-TO-END ELAPSED TIME</text><text x="80" y="464" fill="url(#accent)" font-size="34" font-weight="700">356.266 sec</text>
<rect x="409" y="390" width="330" height="105" rx="14" fill="#101b30" stroke="#2e405e"/><text x="431" y="423" fill="#91a5c5" font-size="14">RAW THROUGHPUT</text><text x="431" y="464" fill="url(#accent)" font-size="31" font-weight="700">28,068.91 / sec</text>
<rect x="760" y="390" width="382" height="105" rx="14" fill="#101b30" stroke="#2e405e"/><text x="782" y="423" fill="#91a5c5" font-size="14">DEDUPLICATION</text><text x="782" y="464" fill="#f2f5ff" font-size="31" font-weight="700">0 duplicates removed</text></g>
<rect x="58" y="527" width="1084" height="1" fill="#344461"/><text x="58" y="563" fill="#d6e1f5" font-family="Arial,sans-serif" font-size="16">Reconciliation rule: deduplicated rows = valid rows + quarantined rows</text><text x="58" y="594" fill="#8fa4c3" font-family="Arial,sans-serif" font-size="15">Elapsed time includes Spark startup, reads, transformations, writes and grouped analytics.</text><text x="58" y="620" fill="#8fa4c3" font-family="Arial,sans-serif" font-size="15">Synthetic local benchmark only — not production/SLA evidence. Windows run used CSV output, not Parquet writes.</text><text x="58" y="665" fill="#6dd9eb" font-family="Arial,sans-serif" font-size="14" letter-spacing="1.5">REPRODUCIBLE EVIDENCE · JSON REPORT + METHODOLOGY IN REPOSITORY</text></svg>